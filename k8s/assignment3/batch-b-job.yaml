apiVersion: batch/v1
kind: Job
metadata:
  name: batch-b-index
  namespace: rahbar
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: indexer}
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      volumes:
        - name: ragops-data
          persistentVolumeClaim: {claimName: ragops-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: [sh, -ec, "python -m pipeline.run --batch-b"]
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CORPUS_DIR, value: /var/lib/rahbar/lake}
            - {name: RAGOPS_DATA_DIR, value: /var/lib/rahbar}
          volumeMounts:
            - {name: ragops-data, mountPath: /var/lib/rahbar}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
