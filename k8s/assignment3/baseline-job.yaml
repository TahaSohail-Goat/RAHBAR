apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-baseline
  namespace: rahbar
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: ragops-eval}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      volumes:
        - name: ragops-data
          persistentVolumeClaim: {claimName: ragops-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      containers:
        - name: eval
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          command: [python, -m, eval.assignment3.runner]
          args: [--collection, rahbar, --baseline]
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CHROMA_COLLECTION, value: rahbar}
            - {name: CORPUS_DIR, value: /var/lib/rahbar/lake}
            - {name: RAGOPS_DATA_DIR, value: /var/lib/rahbar}
          volumeMounts:
            - {name: ragops-data, mountPath: /var/lib/rahbar}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 3Gi, ephemeral-storage: 1Gi}
