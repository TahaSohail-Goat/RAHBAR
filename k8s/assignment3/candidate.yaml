apiVersion: batch/v1
kind: Job
metadata:
  name: candidate-index
  namespace: rahbar
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: indexer}
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: ragops-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: [sh, -ec, "python -m pipeline.run"]
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CORPUS_DIR, value: /var/lib/rahbar/lake}
            - {name: RAGOPS_DATA_DIR, value: /var/lib/rahbar}
            - {name: CHROMA_COLLECTION, value: rahbar-candidate}
            - {name: CHUNK_SIZE, value: "320"}
            - {name: CHUNK_OVERLAP, value: "50"}
          volumeMounts:
            - {name: corpus, mountPath: /var/lib/rahbar}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api-candidate}
  template:
    metadata:
      labels: {app: api-candidate}
    spec:
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      volumes:
        - name: ragops-data
          persistentVolumeClaim: {claimName: ragops-data}
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CHROMA_COLLECTION, value: rahbar-candidate}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: rahbar-secret, key: LLM_API_KEY, optional: true}
          volumeMounts:
            - {name: ragops-data, mountPath: /var/lib/rahbar}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 200m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: "1", memory: 1Gi, ephemeral-storage: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  type: ClusterIP
  selector: {app: api-candidate}
  ports:
    - {name: http, port: 8000, targetPort: http}
