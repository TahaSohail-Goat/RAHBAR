apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: chroma
  LLM_PROVIDER: ollama-host
  EMBED_MODEL: nomic-embed-text
  LLM_MODEL: llama3.2:3b
  HOSTED_BASE_URL: ""
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OLLAMA_URL: http://host.minikube.internal:11434 # NOSONAR: isolated Minikube bridge /32; see docs/SECURITY-REVIEW.md.
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.55"
  CACHE_THRESHOLD: "0.95"
  CACHE_TTL_SECONDS: "86400"
  TEMPERATURE: "0.2" # Low variance for policy facts and schema output; not a truth guarantee.
  LLM_SEED: "42"
  LOG_LEVEL: INFO
  CORPUS_DIR: /var/lib/rahbar/lake
  RAGOPS_DATA_DIR: /var/lib/rahbar
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
